name: "Push checker"

on:
  pull_request:
  push:
    # Without this, every push to a PR branch runs the checks twice: once for push, once for pull_request.
    branches: [master]

jobs:
  fmt_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
        channel: nixos-24.05
        packages: nixpkgs#nixfmt-rfc-style nixpkgs#just
    - name: Check formatting
      run: just fmt --check

  nix_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
        cache: true
        packages: nixpkgs#just
    - name: Run flake checks
      run: just test

  home_check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["mbpapp", "deskapp", "servapp", "piapp", "piprint", "piups", "vps"]
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
    - run: HOST="${{ matrix.host }}" ./x home check

  darwin_check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["mbpapp"]
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
    - run: HOST="${{ matrix.host }}" ./x darwin check

  nixos_check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["deskapp", "servapp", "piapp", "piprint", "piups", "vps"]
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
    - name: Check
      run:
        HOST="${{ matrix.host }}" ./x nixos check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
