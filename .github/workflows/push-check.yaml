name: "Push checker"

on:
  pull_request:
  push:
    # Without this, every push to a PR branch runs the checks twice: once for push, once for pull_request.
    branches: [master]

jobs:
  lock_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install gh-actions-lock
      run: gh extension install github/gh-actions-lock --pin v0.4.1
    - name: Verify workflow lockfile
      run: gh actions-lock --verify

  workflow_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: $/.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
        packages: nixpkgs#actionlint nixpkgs#just
    - name: Lint workflows
      run: just ci::lint

  fmt_check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: $/.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
        channel: nixos-24.05
        packages: nixpkgs#nixfmt-rfc-style nixpkgs#just
    - name: Check formatting
      run: just fmt --check

  nix_tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: $/.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
        cache: true
        packages: nixpkgs#just
    - name: Run flake checks
      run: just test

  home_check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["mbpapp", "deskapp", "servapp", "piapp", "piprint", "piups", "vps"]
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: $/.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
    - run: HOST="${{ matrix.host }}" ./x home check

  darwin_check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["mbpapp"]
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: $/.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
    - run: HOST="${{ matrix.host }}" ./x darwin check

  nixos_check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ["deskapp", "servapp", "piapp", "piprint", "piups", "vps"]
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: $/.github/actions/nix-setup
      with:
        github-token: ${{ secrets.GH_PAT }}
    - name: Check
      run:
        HOST="${{ matrix.host }}" ./x nixos check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
