# Garbage collection for the hestia binary cache.
#
# GC must run on the default branch: a PR job's cache scope is read-only towards the default branch and dies with the
# PR, while the default-branch scope grows forever without GC.
#
name: "Cache GC"

# GC handles concurrent pushes but not a concurrent GC: a second run's repack reads race the first run's post-commit
# pack deletes. Queue manual runs behind the scheduled one instead of overlapping it.
concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 4 * * 0" # Sundays 4:17AM EST, off-peak and out of the way of the nightly updater
      timezone: "America/Toronto"
  workflow_dispatch: # allow manual triggering
    inputs:
      dry-run:
        description: "Plan only; do not repack, touch, or delete anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # REST cache deletes need actions:write.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The hestia action writes a nix.conf and a hook shim, so Nix is installed first, mirroring hestia's own gc.yml.
      - uses: ./.github/actions/nix-setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Mic92/hestia@v3
        with:
          version: "v3.1.0"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run garbage collection
        run: |
          "${HESTIA_BIN:-hestia}" gc \
            ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
