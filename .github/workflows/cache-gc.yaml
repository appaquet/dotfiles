# Garbage collection for the hestia binary cache.
#
# Only useful on the default branch: a PR's cache scope is read-only and disappears with the PR, while the
# default-branch scope keeps growing until something deletes from it.
name: "Cache GC"

# A second GC must not overlap the first: its repack reads race the first run's pack deletes.
concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 4 * * 0" # Sundays; the cache churns slowly, so daily GC would buy nothing
      timezone: "America/Toronto"
  workflow_dispatch: # allow manual triggering
    inputs:
      dry-run:
        description: "Plan only; do not repack, touch, or delete anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Deleting cache entries uses the REST API, which needs `actions: write`.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # hestia's action needs Nix installed and writes a nix.conf, even though `gc` itself only calls the REST API.
      - uses: ./.github/actions/nix-setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: "v3.1.0"

      - name: Run garbage collection
        run: |
          "${HESTIA_BIN:-hestia}" gc \
            ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
