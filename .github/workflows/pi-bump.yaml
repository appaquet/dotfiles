# Bumps Pi npm extension pins
name: "Pi plugin bumper"

on:
  schedule:
    - cron: "40 6 */3 * *" # every 3 days; odd minute avoids top-of-hour queueing
      timezone: "America/Toronto"
  workflow_dispatch: # allow manual triggering
    inputs:
      extra_instruction:
        description: "Optional instruction for the agent, e.g. 'skip pi-web-access'"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pi-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: $/.github/actions/pi-agent
        env:
          PR_CREATE_TOKEN: ${{ github.token }}
        with:
          gh-pat: ${{ secrets.GH_PAT }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Run the Pi npm plugin bump.

            You are in a CI checkout of `appaquet/dotfiles` on `master`: work in git (not jj), and never
            run `./x home switch`. Eligibility, release notes, and the verification commands come from
            `.agents/skills/pi-plugin-bump/SKILL.md`; adapt them to this checkout.

            Audit first, then verify. Finish the skill's eligibility steps, and stop there when no package
            moves: every pin is already the newest eligible version, or the only newer release is still
            inside the 3-day release-age window. A run with nothing to bump is a no-op — skip
            `./x home check`, skip the packages eval, skip the PR, and report one row per package with its
            pin, the newest eligible version, that version's publish date, and either the bump decision or
            the date the held-back release becomes eligible. A failed lookup is not "nothing to bump": report
            the failure instead of an empty audit.

            Only when at least one pin changes, verify before publishing: `HOST=deskapp ./x home check` must
            exit 0 and the skill's packages eval must list the new pin specs.

            Publish per `.github/prompts/agent-publish-contract.md` on `pi/plugin-bump` against `master`,
            with title `chore(pi): bump plugin pins`. Use the owner token for pushes and
            existing PR edits. Open new PRs with `PR_CREATE_TOKEN` as the Actions bot and request
            review from `appaquet`. If that fails, report it; don't open the PR as the owner.

            The body must list old/new versions with publish dates, risk notes from the release notes,
            the verification commands, the apply step, and a note that a `@pi-dotfiles ...` comment on
            the bump PR relaunches the bump.

            Extra instruction for this run, if any:
            ${{ inputs.extra_instruction }}
          with-node: "true"
          npm-min-release-age: "3"
