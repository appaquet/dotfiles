name: "Pi plugin bumper"

description: "Bumps Pi npm extension pins; comment @pi-bump ... on the bump PR to relaunch"

on:
  schedule:
    - cron: "40 6 */3 * *" # every 3 days; odd minute avoids top-of-hour queueing
      timezone: "America/Toronto"
  workflow_dispatch: # allow manual triggering
    inputs:
      extra_instruction:
        description: "Optional instruction for the agent, e.g. 'skip pi-web-access'"
        required: false
        type: string
  issue_comment: # reply on the bump PR with a comment starting with @pi-bump to relaunch
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pi-bump
  cancel-in-progress: false

jobs:
  bump:
    # Comment runs only from AP, only on a PR, and only with the command prefix. The bot's own
    # comments are authored by github-actions[bot], so they can never satisfy this check.
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'appaquet' &&
       (github.event.comment.body == '@pi-bump' || startsWith(github.event.comment.body, '@pi-bump ')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/pi-agent
        with:
          prompt: |
            Run the Pi npm plugin bump.

            You are in a CI checkout of `appaquet/dotfiles` on `master`: work in git (not jj), and never
            run `./x home switch`. Eligibility, release notes, and the verification commands come from
            `.agents/skills/pi-plugin-bump/SKILL.md`; adapt them to this checkout. Before publishing,
            `HOST=deskapp ./x home check` must exit 0 and the skill's packages eval must list the new
            pin specs.

            Publish per `.github/prompts/agent-publish-contract.md`. Open the PR against `master` on branch
            `pi/plugin-bump`, title `chore(pi): bump plugin pins`. The body must list old/new versions
            with publish dates, risk notes from the release notes, the verification commands, the apply
            step, and the `@pi-bump` steering commands.

            Extra instruction for this run, if any (it may start with `@pi-bump`; ignore that word):
            ${{ inputs.extra_instruction || github.event.comment.body }}
          with-node: "true"
          npm-min-release-age: "3"
          update-comment: ${{ github.event_name == 'issue_comment' }}
