name: "Nix setup"
description: "Install Nix with this repo's GitHub token, substituters and trusted keys, optionally cache build results with hestia, then optionally install packages from a nixpkgs channel."

inputs:
  github-token:
    description: "Token for authenticated GitHub requests, used to resolve private flake inputs"
    required: true
  cache:
    description: "Cache build results in the GitHub Actions cache with hestia. Enable only in jobs that build, since substitutes and evaluation never reach the post-build hook"
    required: false
    default: "false"
  channel:
    description: "nixpkgs channel added before installing packages; ignored when packages is empty"
    required: false
    default: "nixos-unstable"
  packages:
    description: "Space-separated nixpkgs attributes to install, for example \"nixpkgs#just\". Empty skips the channel and install steps"
    required: false
    default: ""
  extra-features:
    description: "Extra Nix experimental features appended to \"nix-command flakes\""
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes ${{ inputs.extra-features }}
          access-tokens = github.com=${{ inputs.github-token }}
          substituters = https://cache.nixos.org https://nix-community.cachix.org https://nixos-raspberrypi.cachix.org https://cache.numtide.com https://cache.nixos-cuda.org https://pi.cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= pi.cachix.org-1:lGeoGJaZ5ZDabuRzkcD5EBTNnDM4HJ1vqeOxlWk1Flk=
        github-token: ${{ inputs.github-token }}

    # Registers a localhost substituter plus a post-build hook for the rest of the job. No
    # permissions are needed: uploads authenticate with the runner-injected ACTIONS_RUNTIME_TOKEN.
    - uses: Mic92/hestia@v3
      if: inputs.cache == 'true'
      with:
        version: "v3.1.0"
        github-token: ${{ inputs.github-token }}
        # Keep the 10 GB repo quota for this repo's own derivations: anything our substituters can
        # already serve is skipped instead of uploaded.
        upstream-cache-filter: true
        upstream-cache-key-names: cache.nixos.org-1 nix-community.cachix.org-1 nixos-raspberrypi.cachix.org-1 niks3.numtide.com-1 cache.nixos-cuda.org pi.cachix.org-1
        # Updater closures are large; the 300s default is short for them.
        drain-timeout: 900
    - name: Add & update nixpkgs channel
      if: inputs.packages != ''
      shell: bash
      run: |
        nix-channel --add "https://nixos.org/channels/${{ inputs.channel }}" nixpkgs
        nix-channel --update nixpkgs
        nix profile install ${{ inputs.packages }}
