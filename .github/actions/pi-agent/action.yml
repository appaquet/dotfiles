name: "Pi agent setup"
description: "Shared setup for the dotfiles agent workflows. The workflow checks out the repo first; this runs nix-setup, optional node, then the pinned pi-coding-agent-action."

inputs:
  prompt:
    description: "Full prompt for the agent"
    required: true
  cache:
    description: "Cache build results with hestia (passed to nix-setup). Only useful in jobs that build"
    required: false
    default: "false"
  with-node:
    description: "Install Node 24 before the agent runs"
    required: false
    default: "false"
  npm-min-release-age:
    description: "When non-empty, apply `npm config set min-release-age <value>` so the agent's installs match the local machine"
    required: false
    default: ""
  update-comment:
    description: "Have the action post a report comment on the triggering comment"
    required: false
    default: "false"
  gh-pat:
    description: "Repo owner token, for nix-setup and the agent's git/gh publish path (composite actions cannot read secrets directly)"
    required: true
  opencode-api-key:
    description: "API key for the opencode-go provider"
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/nix-setup
      with:
        github-token: ${{ inputs.gh-pat }}
        cache: ${{ inputs.cache }}

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      if: ${{ inputs.with-node == 'true' }}
      with:
        node-version: 24

    # Must run after setup-node and before the agent, so it lives here rather than in the workflow.
    - name: Match the local npm release-age policy
      if: ${{ inputs.npm-min-release-age != '' }}
      shell: bash
      run: npm config set min-release-age ${{ inputs.npm-min-release-age }}

    # Pinned by commit: a moved tag would change the agent silently.
    - name: Run the agent
      uses: shaftoe/pi-coding-agent-action@381f578da466b8d2ef48f0fdb8a940f276fe4c3c # v2.30.1
      env:
        GH_TOKEN: ${{ inputs.gh-pat }} # lets the agent read release notes and clone branches
      with:
        github_token: ${{ github.token }}
        provider: opencode-go
        model: deepseek-v4.1-flash
        token: ${{ inputs.opencode-api-key }}
        thinking_level: high
        refresh_model_catalog: false
        update_comment: ${{ inputs.update-comment }}
        prompt: ${{ inputs.prompt }}
