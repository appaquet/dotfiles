version: 2

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/nix-setup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Toronto"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
